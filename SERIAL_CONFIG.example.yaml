# Standalone CPA quota scheduler v0.2.1.
plugins:
  enabled: true
  configs:
    codex-quota-scheduler:
      enabled: true
      priority: 2000
      scheduler_mode: serial
      # Set balanced for concurrent, quota-weighted distribution across accounts.
      # This can also be selected in the Codex 额度调度 panel without editing YAML.
      serial_allocation_policy: sustainable
      # Relative improvement in weekly budget per day; two fresh observations and hold still apply.
      serial_budget_rebalance_percent: 20
      serial_soft_continuation: false
      # Capacity priors only; do not multiply these into weekly health scores.
      quota_default_plan: team_standard
      # Optional CPA auth-file IDs (not tokens or email addresses):
      # quota_account_plans:
      #   account-pro-5: pro_5x
      #   account-pro-20: pro_20x
      #   account-premium: team_premium
      serial_switch_percent: 98
      serial_handoff_mode: threshold_only
      # Use observed 5h capacity without reserving for cache age or predicted consumption.
      # Hard quota/disallowed state or an upstream 429 still triggers server-side handoff.
      serial_5h_handoff_mode: 429_only
      serial_5h_switch_percent: 98
      serial_prefer_active_cycle: true
      # Raw-weekly fallback policy advantage in percentage points.
      # Requires two distinct fresh readings of both accounts; safety handoffs do not wait.
      serial_weekly_rebalance_percent: 10
      serial_weekly_rebalance_min_hold: 5m
      switch_hysteresis_percent: 2
      drain_window_hours: 6
      cpa_management_url: http://127.0.0.1:8317/v0/management/api-call
      cpa_management_key_file: /run/secrets/management_key
      quota_url: https://chatgpt.com/backend-api/wham/usage
      refresh_interval: 30s
      quota_refresh_cooldown: 2m
      quota_refresh_batch: 8
      stale_after: 15m
      state_path: /var/lib/codex-quota-scheduler/state.json
      reserve_5h_percent: 0
      reserve_weekly_percent: 8
      reserve_monthly_percent: 12
      fallback_ban: 15m
      max_ban: 24h
      half_open_probe_timeout: 15m
      half_open_retry_after: 2m
      prefer_reset_credits: true
      window_order: [5h, weekly, monthly]
      # Optional generation via CPA HostModel, separate from read-only quota queries.
      warmup_enabled: false
      warmup_execution_mode: native
      warmup_model: gpt-5.6-luna
      warmup_retry_after: 15m
      # Pool-wide limits; failures count and reloads do not reset the budget.
      warmup_min_interval: 15m
      warmup_max_per_day: 8

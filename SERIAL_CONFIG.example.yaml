# Recommended configuration for Codex Quota Scheduler v0.1.21.
# Secrets stay in mounted files. This plugin does not change model names,
# provider routes, OAuth/PAT state, or third-party APIs.
plugins:
  enabled: true
  configs:
    codex-quota-scheduler:
      enabled: true
      priority: 2000

      # One global active account. It switches at a hard/soft quota boundary,
      # 429/quarantine, confirmed candidate loss, weekly-reserve protection,
      # higher-priority window availability, or a confirmed new 5h cycle.
      scheduler_mode: serial
      serial_switch_percent: 98
      # threshold_only follows serial_switch_percent exactly. Set this to
      # reserve_aware when you want handoff to preserve the reserve for the
      # active 5h, weekly, or monthly window.
      serial_handoff_mode: threshold_only
      # 5h-only override. inherit_global preserves serial_switch_percent;
      # custom_threshold uses serial_5h_switch_percent; reserve_aware keeps
      # reserve_5h_percent; 429_only waits for hard limit/disallowed/429.
      serial_5h_handoff_mode: inherit_global
      serial_5h_switch_percent: 98
      serial_prefer_active_cycle: true

      # End-of-cycle drain is capped at the smaller of this value and the last
      # 10% of the quota window. With 6h configured, 5h drains only in its
      # final 30m; hard limits, disallowed windows, quarantine, and 429 still
      # force failover.
      drain_window_hours: 6

      keeper_url: http://cpa-usage-keeper:8080/keeper
      keeper_password_file: /run/secrets/keeper_login_password
      refresh_interval: 30s
      stale_after: 15m

      # Used by reserve_aware handoff for the 5h window. Weekly and monthly
      # use reserve_weekly_percent and reserve_monthly_percent respectively.
      reserve_5h_percent: 15

      state_path: /var/lib/codex-quota-scheduler/state.json

      fallback_ban: 15m
      max_ban: 24h
      half_open_probe_timeout: 15m
      half_open_retry_after: 2m

      # Window order is strict. After cold start, weekly remaining-capacity
      # tiers are balanced first; inside the best tier, lower 5h usage and the
      # longest-idle account win deterministic tie-breaks.
      prefer_reset_credits: true
      window_order:
        - 5h
        - weekly
        - monthly

      # Warmup is separate from normal serial routing. Every fully available,
      # not-yet-started account is activated strictly one at a time; normal
      # traffic keeps using the committed serial account.
      warmup_enabled: true
      # Production-safe default for hot reload. Native HostModel warmup is an
      # explicit canary-only opt-in until CPA exposes a bounded callback timeout.
      warmup_execution_mode: management
      # Used only by the pinned activation request. It does not change CPA's
      # default channel or the model selected for normal traffic.
      warmup_model: gpt-5.6-luna
      warmup_sidecar_url: http://codex-agent-identity-gateway:8787/backend-api/codex
      warmup_retry_after: 15m
      cpa_management_url: http://127.0.0.1:8317/v0/management/api-call
      cpa_management_key_file: /run/secrets/management_key

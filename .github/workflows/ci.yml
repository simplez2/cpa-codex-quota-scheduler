name: CI

on:
  push:
    branches: [main, "agent/**", "codex/**"]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: codex-quota-scheduler.so
          - os: windows-latest
            library: codex-quota-scheduler.dll
          - os: macos-latest
            library: codex-quota-scheduler.dylib
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard authentication tests
        run: node --test web/*.test.mjs
      - name: Dashboard module syntax
        run: for file in web/*.mjs; do node --check "$file"; done
      - name: Verify release metadata and host patch checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python .github/scripts/verify_release.py
      - name: Release archive integrity tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Race test
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build native plugin
        env:
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -o "${{ matrix.library }}" .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Build and release Codex Quota Scheduler for all supported platforms.
#
# Triggered by pushing a tag named v<version> (e.g. v0.1.0). For each platform
# it builds the CGO dynamic library with the host's native C toolchain, packs
# it into the zip layout required by the CLIProxyAPI plugin store, and uploads
# everything to the GitHub Release bound to that tag.
#
# Output assets (version = tag without the leading "v"):
#   codex-quota-scheduler_<version>_linux_amd64.zip      -> codex-quota-scheduler.so
#   codex-quota-scheduler_<version>_linux_arm64.zip      -> codex-quota-scheduler.so
#   codex-quota-scheduler_<version>_darwin_arm64.zip     -> codex-quota-scheduler.dylib
#   codex-quota-scheduler_<version>_windows_amd64.zip    -> codex-quota-scheduler.dll
#   checksums.txt
#   release-verification.json
name: Release Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ github.event.inputs.release_tag || github.ref }}
      release_tag: ${{ github.event.inputs.release_tag || github.ref_name }}

  build:
    needs: validate
    permissions:
      contents: read
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      # Debian 12's glibc baseline keeps the Linux asset loadable on CPA hosts
      # running Bookworm; ubuntu-latest can otherwise require a newer glibc.
      - name: Build Linux dynamic library
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e CGO_ENABLED=1 -e GOOS -e GOARCH \
            golang:1.26.10-bookworm go build -buildvcs=false -buildmode=c-shared -o codex-quota-scheduler.so .
        shell: bash

      - name: Build native dynamic library
        if: matrix.goos != 'linux'
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -buildmode=c-shared -o codex-quota-scheduler.${{ matrix.ext }} .
        shell: bash

      - name: Compute version (tag without leading v)
        id: ver
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Pack zip (library at zip root)
        id: pack
        shell: bash
        run: |
          asset=$(python .github/scripts/release_assets.py pack \
            --version '${{ steps.ver.outputs.version }}' --source-commit "$(git rev-parse HEAD)" \
            --os '${{ matrix.goos }}' --arch '${{ matrix.goarch }}' \
            --library 'codex-quota-scheduler.${{ matrix.ext }}' --assets .)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.asset }}
          path: ${{ steps.pack.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish checksums and Release assets
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source for verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Compute version
        id: ver
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Validate all packages and generate checksums
        run: |
          python .github/scripts/release_assets.py verify-set \
            --version '${{ steps.ver.outputs.version }}' --source-commit "$(git rev-parse HEAD)" \
            --assets assets --write-checksums
          python .github/scripts/release_assets.py verify-set \
            --version '${{ steps.ver.outputs.version }}' --source-commit "$(git rev-parse HEAD)" \
            --assets assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            assets/*.zip
            assets/checksums.txt
            assets/release-verification.json
          generate_release_notes: true

name: Warmup pending confirmation repair

on:
  push:
    branches: [fix/warmup-window-cycles]
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/warmup-window-cycles
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Apply confirmation-state fix
        run: python3 .github/warmup_confirm_pending_patch.py
      - name: Format
        run: gofmt -w warmup.go warmup_confirmation.go warmup_confirmation_test.go warmup_window_cycles_regression_test.go
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux plugin
        env:
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -o /tmp/codex-quota-scheduler.so .
      - name: Commit verified confirmation-state fix
        shell: bash
        run: |
          rm .github/workflows/warmup-confirm-pending-bot.yml .github/warmup_confirm_pending_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: confirm warmup quota windows from fresh observations"
          git push origin HEAD:fix/warmup-window-cycles
